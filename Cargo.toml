[package]
name = "rscan"
version = "0.5.0"
edition = "2021"
description = "Fast CLI port scanner"
authors = ["idesyatov"]
repository = "https://github.com/idesyatov/rscan"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
