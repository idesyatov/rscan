name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Linux
        run: cargo build --release

      - name: Build Windows
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Prepare binaries
        run: |
          mkdir -p artifacts
          cp target/release/rscan artifacts/rscan-linux-amd64
          cp target/x86_64-pc-windows-gnu/release/rscan.exe artifacts/rscan-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rscan-linux-amd64
            artifacts/rscan-windows-amd64.exe
          generate_release_notes: true
