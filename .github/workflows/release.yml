name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Linux
        run: cargo build --release

      - name: Build Windows
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package archives
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          # Linux: tar.gz
          mkdir -p rscan-${TAG}-linux-amd64
          cp target/release/rscan rscan-${TAG}-linux-amd64/
          cp LICENSE rscan-${TAG}-linux-amd64/
          tar czf rscan-${TAG}-linux-amd64.tar.gz rscan-${TAG}-linux-amd64/

          # Windows: zip
          mkdir -p rscan-${TAG}-windows-amd64
          cp target/x86_64-pc-windows-gnu/release/rscan.exe rscan-${TAG}-windows-amd64/
          cp LICENSE rscan-${TAG}-windows-amd64/
          zip -r rscan-${TAG}-windows-amd64.zip rscan-${TAG}-windows-amd64/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rscan-*.tar.gz
            rscan-*.zip
          generate_release_notes: true
